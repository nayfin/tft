name: Release

on:
  push:
    branches:
      - main

permissions:
  # push the version bump commit
  contents: write
  # npm trusted publishing (OIDC): no long-lived NPM_TOKEN, provenance is generated automatically
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No registry-url: it writes an .npmrc that expects NODE_AUTH_TOKEN, which trusted publishing doesn't use
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build publishable lib dependencies
        env:
          NX_DAEMON: false
          NX_NO_CLOUD: true
        run: npx nx build crispr-forms --configuration=production

      - name: Build and publish affected libs
        env:
          NX_DAEMON: false
          NX_NO_CLOUD: true
        run: |
          EXCLUDED=("mat-instantsearch" "ui-imports" "core" "api-interfaces")
          AFFECTED=$(npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD)
          PUBLISHED=()

          # Commit the version bumps of the libs that were actually published, even if a later lib
          # fails. Otherwise the next run would bump to an already-published version and npm would
          # reject it. Bumps of libs that did not publish are discarded.
          commit_published() {
            status=$?
            if [ ${#PUBLISHED[@]} -gt 0 ]; then
              for lib in "${PUBLISHED[@]}"; do
                git add "libs/$lib/package.json"
              done
              git commit -m "chore: bump patch versions for ${PUBLISHED[*]} [skip ci]"
              git push
            fi
            exit $status
          }
          trap commit_published EXIT

          for lib in $AFFECTED; do
            echo "LIB: $lib"
            if [[ " ${EXCLUDED[*]} " =~ " ${lib} " ]]; then
              echo "Skipping $lib (excluded)"
              continue
            fi

            if [ ! -f "libs/$lib/package.json" ]; then
              echo "Skipping $lib (no package.json)"
              continue
            fi

            npm --prefix libs/$lib version patch --no-git-tag-version

            echo "Building $lib..."
            npx nx build $lib --configuration=production

            VERSION=$(node -p "require('./libs/$lib/package.json').version")
            TAG=$([[ "$VERSION" == *"-"* ]] && echo "next" || echo "latest")

            echo "Publishing @tft/$lib@$VERSION with tag $TAG..."
            npm publish dist/libs/$lib --access public --tag $TAG

            PUBLISHED+=($lib)
          done
