name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: false
  NX_NO_CLOUD: true

jobs:
  verify:
    # Pinned: ubuntu-latest is Ubuntu 26.04, which Playwright 1.58 cannot install browsers on.
    # Move back to ubuntu-latest after upgrading Playwright to a version that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # crispr-forms-testing compiles against the built crispr-forms; its build dependsOn ^build, so Nx builds that first
      - name: Build libs and docs app
        run: >
          npx nx run-many -t build
          -p crispr-forms,form-validation-handler,interact,crispr-forms-testing,interact-testing,documentation
          --configuration=production

      # documentation-e2e is a Cypress project and is not run here. The projects' `ci` configurations are not
      # used: they pass --ci, which Playwright does not have. CI=true (set by GitHub) already switches on retries
      # and a single worker in the Playwright config. --parallel=1 runs the two suites one after the other, as two
      # dev-server compiles at once on a 2-core runner risk the 120s webServer timeout.
      - name: E2E
        run: npx nx run-many -t e2e -p crispr-forms-e2e,interact-e2e --parallel=1

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: dist/.playwright/
          if-no-files-found: ignore
          retention-days: 7
