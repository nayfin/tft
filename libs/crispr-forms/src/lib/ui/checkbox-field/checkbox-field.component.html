<crispr-field-container
  [config]="config()"
  [group]="group()"
  [inlineField]="config().inline">
  <div
    [formGroup]="group()">
    <mat-checkbox
      [attr.data-testid]="testId()"
      [color]="config().color"
      [labelPosition]="config().labelPosition"
      [formControlName]="config().controlName">
      {{config().label}}
      @if (config().info) {
        <crispr-info
          matSuffix
          [info]="config().info">
        </crispr-info>
      }
    </mat-checkbox>
  </div>
</crispr-field-container>
