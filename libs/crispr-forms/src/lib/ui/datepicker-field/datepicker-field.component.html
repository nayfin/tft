<crispr-field-container
  [config]="config()"
  [group]="group()">
  <mat-form-field
    [attr.data-testid]="testId()"
    [color]="config().color"
    [class.crispr-datepicker-clearable]="config().clearable"
    [appearance]="config().appearance"
    [formGroup]="group()">
    @if (config().label) {<mat-label>{{config().label}}</mat-label>}
    <input
      matInput
      [formControlName]="config().controlName"
      [min]="config().min"
      [max]="config().max"
      [matDatepicker]="picker"
      [matDatepickerFilter]="config().datepickerFilter">
    <!--
      A control flow block is not projected by the attributes of the element inside it, so the form field would
      place a bare @if'd matSuffix button in the input's slot, under the text. ngProjectAs on the wrapper puts
      it in the icon suffix slot, next to the toggle.
    -->
    <ng-container ngProjectAs="[matSuffix]">
      @if (config().clearable && controlEnabled() && hasValue()) {
        <button
          mat-button
          matSuffix
          type="button"
          class="crispr-datepicker-clear"
          [attr.data-testid]="testId() + '-clear'"
          (click)="clear()">
          {{ config().clearButtonLabel ?? 'Clear' }}
        </button>
      }
    </ng-container>
    <mat-datepicker-toggle matSuffix [for]="picker" />
    <mat-datepicker
      [touchUi]="config().touchUi"
      [startView]="config().startView"
      [startAt]="startAt$ | async"
      [dateClass]="dateClass || (dateClass$ | async)"
      #picker>
      @if (calendarFooterPortal) {
        <mat-datepicker-actions>
          <ng-template [cdkPortalOutlet]="calendarFooterPortal" />
        </mat-datepicker-actions>
      }
    </mat-datepicker>

    @if (config().hint && hintVisible()) {<mat-hint>{{config().hint}}</mat-hint>}

  </mat-form-field>
</crispr-field-container>
