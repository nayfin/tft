<crispr-field-container
  [config]="config()"
  [group]="group()">

  <mat-form-field
    [color]="config().color"
    [appearance]="config().appearance"
    [formGroup]="group()">
    @if (config().label) {<mat-label>{{config().label}}</mat-label>}
    <mat-select
      #selectField
      [formControlName]="config().controlName"
      [placeholder]="config().placeholder"
      cdkOverlayOrigin #trigger="cdkOverlayOrigin"
      (click)="openMap()"/>

  </mat-form-field> 

  <ng-template
    cdkConnectedOverlay
    (overlayOutsideClick)="closeMap()"
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="mapOpen()"
    (detach)="closeMap()"
    (backdropClick)="closeMap()"
    >
    <crispr-autocomplete-field 
      class="search-field"
      [config]="locationConfig"   
      [group]="locationGroup"
      (valueChanges)="onSelectLocation($event)"
      >
    </crispr-autocomplete-field>
    <google-map 
      [center]="(inputCenter | async) || config().center" 
      [zoom]="11"
      [options]="config().options" 
      (mapInitialized)="onMapInit($event)"
      (idle)="onMove(map, group())"
      #map>

      @for (marker of currentMarkers() || []; track $index) {
        <map-advanced-marker
          #markerElem="mapAdvancedMarker"
          [position]="marker.position"
          [content]="marker.content"
          [title]="marker.title"
          (mapClick)="onMarkerClick(marker)"> 
        </map-advanced-marker>
      }
    </google-map>
  </ng-template>
</crispr-field-container>
