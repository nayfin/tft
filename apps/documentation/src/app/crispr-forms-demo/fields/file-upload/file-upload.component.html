<mat-card>
  <h2 class="mat-h2">
    File upload field
  </h2>
  <p class="mat-p">
    Use to upload files
  </p>
  <crispr-form [config]="config" (submitted)="handleSubmit($event)">
  </crispr-form>
  <ul data-testid="files-changed-log">
    @for (entry of filesChangedLog(); track $index) {
      <li>{{ entry }}</li>
    }
  </ul>
</mat-card>
